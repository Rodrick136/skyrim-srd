name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/skyrim/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . --preset=skyrim

      - name: Build
        run: cmake --build build/skyrim --config Release

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist/SKSE/Plugins
          cp build/skyrim/release/*.dll dist/SKSE/Plugins/
          cp build/skyrim/release/*.pdb dist/SKSE/Plugins/
          if [ -d package ]; then cp -r package/. dist/; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundRecordDistributor
          path: dist/
